name: Build Patente B v69 Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and test source
        run: |
          npm ci
          npm run build
          npm test
      - name: Sync Capacitor
        run: |
          npx cap sync android
      - name: Build debug APK with matching signing key
        env:
          PATENTE_DEBUG_KEYSTORE_B64: ${{ secrets.PATENTE_DEBUG_KEYSTORE_B64 }}
        run: bash scripts/ci-assemble-debug.sh
      - name: Verify Android TTS service is declared
        run: |
          merged_manifest="$(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*/merged_manifest*/debug/*' -print -quit)"
          test -n "$merged_manifest"
          grep -Fq 'android.intent.action.TTS_SERVICE' "$merged_manifest"
      - name: Reject incompatible APK signing certificate
        run: bash scripts/verify-apk-certificate.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: patente-b-v69-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
